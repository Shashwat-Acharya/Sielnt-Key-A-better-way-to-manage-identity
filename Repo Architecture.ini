GETTING STARTED
═════════════════════════════════════════════════════════════════════════════

Quick Start:
  See QUICK_START.md for detailed setup guide

Basic Setup:

1. Install Poetry (if not already installed):
   pip install poetry

2. Install project dependencies:
   poetry install

3. Setup PostgreSQL:
   - Windows: .\infra\postgres\bootstrap.ps1
   - Linux/macOS: ./infra/postgres/bootstrap.sh

4. Configure environment:
   - Copy .env.example to .env
   - Update database credentials
   - Run: python scripts/validate_env.py

5. Setup Django:
   cd backend
   poetry run python manage.py migrate
   poetry run python manage.py createsuperuser

6. Run development server:
   poetry run python manage.py runserver

7. Run tests:
   poetry run python manage.py test
   poetry run pytest tests/

See individual README.md files in each folder for detailed documentation.


